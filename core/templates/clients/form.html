{% extends "base.html" %}
{% block content %}
<h1>{% if client %}Клиент: {{ client.full_name }}{% else %}Новый клиент{% endif %}</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <div>
        <button class="btn btn-danger">Сохранить</button>
        <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
